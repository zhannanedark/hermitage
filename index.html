<title>Эрмитаж · Карта залов</title>

<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --surface:#F4F4F1; --ink:#131414; --ink-soft:#8A8A8E; --line:#ECECE8;
  --accent:#DFF24C; --accent-ink:#1A1C0F; --neva:#4C8577;
  --z-russia:#9A95C8; --z-interior:#8CB811; --z-france:#0A79C4; --z-spain:#C4A8C0;
  --z-germany:#86CDF0; --z-england:#92C89A; --z-flanders:#6E86C8; --z-holland:#A08E96;
  --z-neth:#C6C4E4; --z-italy:#009A4E; --z-medieval:#9B72C4; --z-arms:#7E7CC0;
  --z-church:#F6EE8C; --z-oldrus:#EC7A6E; --z-icons:#E8E000;
  --z-siberia:#B84C9A; --z-centasia:#F5E400; --z-antiq:#C9C77E; --z-caucasus:#E87200;
  --z-egypt:#F5A800; --z-evrasia:#F0A8B4; --z-neareast:#F8CE9B; --z-eastarms:#A5322A;
  --z-fareast:#E8121A; --z-islam:#4FBFAE; --z-iran:#E1471D; --z-byz:#EDE68A;
  --z-numis:#99931E; --z-reserve:#B87534; --z-temp:#1E3320; --z-closed:#E2E2E0;
  --shadow:0 10px 30px rgba(19,20,20,.10);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button{color:var(--ink);font-family:inherit;-webkit-appearance:none;appearance:none}
a{color:var(--ink)}
html,body{height:100%}
body{font-family:'Inter',system-ui,sans-serif;color:var(--ink);background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
header{padding:calc(14px + env(safe-area-inset-top)) 16px 4px;display:flex;align-items:center;gap:10px}
h1{font-family:'Inter Tight';font-weight:800;font-size:26px;letter-spacing:-.02em;flex:1}
.floors{display:flex;background:var(--surface);border-radius:999px;padding:3px;height:38px}
.floors button{border:0;background:transparent;width:32px;border-radius:999px;font:700 13px 'Inter';color:var(--ink-soft)}
.floors button.on{background:var(--ink);color:#fff}
.controls{display:flex;gap:8px;padding:6px 16px 4px}
.me-pill{border:0;background:var(--surface);border-radius:999px;height:44px;padding:0 16px;
  font:700 14px 'Inter';color:var(--ink-soft);display:flex;align-items:center;gap:7px;flex:0 0 auto}
.me-pill.set{background:var(--surface);color:var(--ink)}
.me-pill.set .ic{color:var(--ink)}
.me-pill .ic{width:15px;height:15px}
.btn-go{flex:1;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:44px;
  font:800 15px 'Inter Tight';display:flex;align-items:center;justify-content:center;gap:7px}
.legend{display:flex;gap:6px;overflow-x:auto;padding:8px 16px 10px;scrollbar-width:none}
.legend::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
  border-radius:999px;padding:7px 13px;font:600 13px 'Inter';color:var(--ink)}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.chip.on .dot{width:11px;height:11px}
.mapwrap{flex:1;position:relative;overflow:hidden;border-top:1px solid var(--line);background:#FBFBFA}
.neva-label{position:absolute;top:8px;left:50%;transform:translateX(-50%);font:700 10px 'Inter';
  color:var(--neva);letter-spacing:.32em;pointer-events:none}
.tools .locate{background:#fff;color:var(--ink)}
.tools .locate.centered{background:var(--ink);color:#fff}
.tools .locate.compass{background:var(--accent);color:var(--accent-ink)}
#stage{position:absolute;inset:0;touch-action:none}
svg text{pointer-events:none;user-select:none}
.room{stroke-width:1.2;transition:opacity .15s}
.room.dim{opacity:.10}
.room.route{stroke:var(--ink);stroke-width:2.4}
.room.sel{stroke:var(--ink);stroke-width:2.8}
.room.me{stroke:var(--ink);stroke-width:3.4;paint-order:stroke}
.me-glow{fill:none;stroke:var(--accent);stroke-width:8;opacity:.9}
.room.flash{animation:fl .5s ease 3}
@keyframes fl{0%,100%{fill-opacity:.5}50%{fill-opacity:.95}}
.rn{font-family:'Inter';font-weight:700;fill:var(--ink);opacity:.75;paint-order:stroke;
  stroke:#fff;stroke-width:2.4;stroke-linejoin:round}
.star{font-size:9px}
.court{fill:none;stroke:var(--line);stroke-dasharray:4 4}
.court-t{font:600 9px 'Inter';fill:var(--ink-soft);letter-spacing:.1em}
.bld{font:700 10px 'Inter';fill:var(--ink-soft);letter-spacing:.08em;text-transform:uppercase}
.stair-i{stroke:var(--ink);stroke-width:1.6;fill:none;opacity:.7;stroke-linecap:round}
.here{fill:var(--ink);stroke:var(--accent);stroke-width:3;transition:cx .35s linear,cy .35s linear}
.here-pulse{transition:cx .35s linear,cy .35s linear}
.here-pulse{fill:var(--accent);opacity:.55;animation:pu 1.7s ease-out infinite}
@keyframes pu{0%{r:7}70%{r:17;opacity:0}100%{r:17;opacity:0}}
.cone{fill:var(--ink);fill-opacity:.14}
.routeline{fill:none;stroke:var(--ink);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:1 9;animation:da 1.2s linear infinite}
@keyframes da{to{stroke-dashoffset:-20}}
.geo-blob{fill:var(--neva);fill-opacity:.10;stroke:var(--neva);stroke-dasharray:3 3;stroke-opacity:.5}
.tools{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;
  flex-direction:column;gap:8px;align-items:center;transition:bottom .25s cubic-bezier(.3,.9,.35,1)}
.tools button{width:44px;height:44px;border-radius:999px;border:0;background:#fff;box-shadow:var(--shadow);
  display:flex;align-items:center;justify-content:center;color:var(--ink)}
.tools .zoomgrp{display:flex;flex-direction:column;background:#fff;border-radius:999px;
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:20px}
.tools .zoomgrp button{width:44px;height:42px;border-radius:0;box-shadow:none;font:500 20px 'Inter';color:var(--ink)}
.tools .zoomgrp button:first-child{border-bottom:1px solid var(--line)}
.tools button.wide{width:auto;padding:0 12px;gap:6px}
.tools button i{font:700 11px 'Inter';font-style:normal}
.tools button.on{background:var(--ink);color:#fff}
.tools .locate{background:var(--ink);color:#fff}
.tools .locate.on{background:var(--accent);color:var(--accent-ink)}
.tools svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tools .zbtn{font:600 20px 'Inter';width:40px;height:40px}
.zonebar{position:absolute;top:8px;left:56px;right:12px;z-index:7;display:flex;align-items:center;gap:9px;
  background:#fff;border-radius:16px;padding:9px 10px 9px 12px;box-shadow:var(--shadow)}
.zonebar[hidden]{display:none}
.zb-dot{width:12px;height:12px;border-radius:4px;flex:0 0 auto}
.zb-tx{flex:1;min-width:0;font:700 13.5px/1.25 'Inter'}
.zb-go{border:0;background:var(--ink);color:#fff;border-radius:999px;height:34px;padding:0 14px;
  font:700 12.5px 'Inter';flex:0 0 auto}
.zb-x{border:0;background:transparent;color:var(--ink-soft);font-size:17px;width:26px;flex:0 0 auto}
.target{position:absolute;top:30px;left:12px;right:12px;z-index:6;display:flex;align-items:flex-start;gap:10px;
  background:#fff;border-radius:16px;padding:11px 12px;box-shadow:var(--shadow)}
.target[hidden]{display:none}
.t-tx{flex:1;min-width:0}
.t-kind{display:block;font:700 9.5px 'Inter';letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:2px}
.target b{display:block;font:700 14px/1.25 'Inter'}
.target span{font:500 12px 'Inter';color:var(--ink-soft)}
.target button{border:0;background:var(--surface);border-radius:999px;height:34px;padding:0 13px;
  font:700 12px 'Inter';color:var(--ink);flex:0 0 auto}
.target #tRoute{background:var(--ink);color:#fff}
.herebar{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;
  display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 10px 10px 14px;
  box-shadow:var(--shadow)}
.herebar[hidden]{display:none}
.hb-tx{flex:1;min-width:0}
.hb-tx b{display:block;font:800 15px/1.2 'Inter Tight';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-tx span{display:block;font:600 11.5px 'Inter';color:var(--ink-soft);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb-go{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:38px;
  padding:0 16px;font:800 13px 'Inter Tight';flex:0 0 auto}
.hb-story{border:0;background:var(--surface);color:var(--ink);border-radius:999px;height:38px;
  padding:0 14px;font:700 12.5px 'Inter';flex:0 0 auto;margin-right:6px}
.hb-story[hidden]{display:none}
.resume{position:absolute;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;display:flex;align-items:center;
  background:#fff;border-radius:999px;box-shadow:var(--shadow);padding:4px 4px 4px 14px;max-width:74%}
.resume[hidden]{display:none}
.rs-main{border:0;background:none;text-align:left;padding:6px 8px 6px 0;min-width:0}
.rs-main b{display:block;font:800 14px 'Inter Tight';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs-main span{font:600 11px 'Inter';color:var(--ink-soft)}
.rs-x{border:0;background:var(--surface);color:var(--ink-soft);width:34px;height:34px;border-radius:999px;
  font-size:17px;flex:0 0 auto}
.follow{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;
  background:#fff;border-radius:20px;padding:10px 12px;box-shadow:var(--shadow)}
.f-mini{display:flex;align-items:center;gap:10px}
.f-mtx{flex:1;min-width:0}
.f-mtx b{display:block;font:800 16px/1.2 'Inter Tight';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-mtx span{display:block;font:600 11.5px/1.35 'Inter';color:var(--ink-soft);margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trk{margin-top:7px;border:0;border-radius:999px;padding:4px 10px;font:700 10.5px 'Inter';
  background:var(--surface);color:var(--ink-soft)}
.story{display:block;width:100%;border:0;background:var(--accent);color:var(--accent-ink);
  border-radius:14px;padding:10px 14px;margin-bottom:10px;text-align:left;font:700 13px 'Inter'}
.story[hidden]{display:none}
.story small{display:block;font:600 11px 'Inter';opacity:.7;margin-top:2px}
.trk.on{background:var(--accent);color:var(--accent-ink)}
.f-chev{border:0;background:var(--surface);width:32px;height:32px;border-radius:999px;font-size:16px;color:var(--ink-soft);flex:0 0 auto}
.f-grab{width:34px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 8px}
.follow{transition:transform .25s cubic-bezier(.3,.9,.35,1)}
.follow.away{transform:translateY(calc(100% - 56px));opacity:.96}
.f-more{max-height:50vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transition:max-height .26s cubic-bezier(.3,.9,.35,1),opacity .2s}
.f-more.closing{max-height:0!important;opacity:0;overflow:hidden}
.f-auto{display:flex;align-items:center;gap:8px;margin-top:10px}
.f-auto button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font:700 11.5px 'Inter'}
.f-auto button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.f-auto .st{font:500 11px 'Inter';color:var(--ink-soft);flex:1;min-width:0}
.f-list{margin-top:4px}
.fl-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.fl-row:last-child{border-bottom:0}
.fl-row .tx{flex:1;min-width:0}
.fl-row b{display:block;font:700 13.5px/1.25 'Inter'}
.fl-row span{font:500 11.5px 'Inter';color:var(--ink-soft)}
.fl-row .thumb{width:44px;height:44px;border-radius:10px}
.fl-n{width:24px;height:24px;border-radius:999px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font:700 11px 'Inter';color:var(--ink-soft);flex:0 0 auto}
.fl-row.cur .fl-n{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fl-row.done{opacity:.5}
.fl-row.done .fl-n{background:var(--ink);border-color:var(--ink);color:#fff}
.f-near{margin-top:12px}
.f-near .nh{font:700 11px 'Inter';letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:8px}
.f-near .ni{display:flex;gap:10px;align-items:center;padding:7px 0}
.f-near .ni b{display:block;font:700 13.5px 'Inter'}
.f-near .ni span{font:500 11.5px 'Inter';color:var(--ink-soft)}
.f-near .ni button{margin-left:auto;border:0;background:var(--surface);border-radius:999px;height:30px;padding:0 12px;font:700 11.5px 'Inter'}
.f-confirm{display:flex;align-items:center;gap:8px;padding:10px 0 2px;margin-top:8px;border-top:1px solid var(--line)}
.f-confirm[hidden]{display:none}
.f-confirm b{flex:1;min-width:0;font:700 13.5px 'Inter'}
.f-confirm button{flex:0 0 auto;height:36px;border-radius:999px;padding:0 14px;font:700 12.5px 'Inter';border:0}
.cf-no{background:var(--surface);color:var(--ink)}
.cf-yes{background:var(--ink);color:#fff}
.f-more{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.f-more[hidden]{display:none}
.f-cal{margin-top:10px;font:600 11.5px 'Inter';color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.f-cal button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 9px;font:700 11.5px 'Inter'}
.f-stop{width:100%;margin-top:10px;border:1px solid var(--line);background:#fff;border-radius:12px;
  height:40px;font:700 12.5px 'Inter';color:var(--ink-soft)}
.follow[hidden]{display:none}
.f-row{display:flex;align-items:flex-start;gap:8px}
.f-tx{flex:1;min-width:0}
.f-lab{font:700 10px 'Inter';color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}
.f-tx b{display:block;font:800 19px/1.25 'Inter Tight';margin-top:1px;letter-spacing:-.01em}
.f-works{display:block;font:600 12.5px/1.4 'Inter';color:var(--ink);margin-top:5px}
.f-works .s{color:var(--z-numis)}
.f-info{border:0;background:none;padding:0;margin-top:8px;font:700 12.5px 'Inter';color:var(--ink);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9C9C4}
.f-info[hidden]{display:none}
.f-nextrow{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.f-nx{flex:1;min-width:0;font:500 12.5px/1.35 'Inter';color:var(--ink-soft)}
.f-nx b{font:700 12.5px 'Inter';color:var(--ink)}
.f-go{flex:0 0 auto;border:0;background:var(--surface);color:var(--ink);border-radius:999px;
  height:40px;padding:0 16px;font:700 13px 'Inter'}
.f-go.done{background:var(--ink);color:#fff}
.f-go.ask{background:var(--accent);color:var(--accent-ink)}
.f-x{border:0;background:transparent;color:var(--ink-soft);font-size:20px;width:26px;flex:0 0 auto;line-height:1}

.f-goal{margin-top:8px;font:500 11.5px 'Inter';color:var(--ink-soft)}
.f-stops{display:flex;align-items:center;gap:5px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.f-stops::-webkit-scrollbar{display:none}
.f-stops[hidden]{display:none}
.st-d{flex:0 0 auto;width:24px;height:24px;border-radius:999px;border:1px solid var(--line);background:#fff;
  font:700 11px 'Inter';color:var(--ink-soft);display:flex;align-items:center;justify-content:center}
.st-d.done{background:var(--ink);border-color:var(--ink);color:#fff}
.st-d.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.st-all{flex:0 0 auto;border:0;background:none;font:700 11.5px 'Inter';color:var(--ink);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9C9C4;padding:0 4px}
.f-auto{display:flex;align-items:center;gap:8px;margin-top:8px}
.f-auto button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;
  font:700 11.5px 'Inter';color:var(--ink-soft)}
.f-auto button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.f-auto .st{font:500 11px 'Inter';color:var(--ink-soft);flex:1;min-width:0}

.welcome{position:fixed;inset:0;background:rgba(19,20,20,.35);backdrop-filter:blur(4px);z-index:60;
  display:flex;align-items:flex-end;padding:14px}
.w-card{background:#fff;border-radius:28px;padding:24px 20px 14px;width:100%;box-shadow:var(--shadow)}

.w-main{width:100%;border:0;background:var(--ink);color:#fff;border-radius:999px;height:52px;font:800 15px 'Inter';margin-bottom:8px}
.w-sec{width:100%;border:1px solid var(--line);background:#fff;border-radius:999px;height:48px;font:700 14px 'Inter';color:var(--ink);margin-bottom:8px}
.w-ghost{width:100%;border:0;background:transparent;height:40px;font:600 13px 'Inter';color:var(--ink-soft)}
.dlg-sub{font:500 13.5px/1.5 'Inter';color:var(--ink-soft);margin-top:8px}
.dlg-acts{margin-top:22px}
.dlg-acts .w-main{margin-bottom:10px}
.dlg-acts .w-sec{margin-bottom:6px}
.sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;
  box-shadow:0 -12px 40px rgba(19,20,20,.16);transform:translateY(105%);
  transition:transform .28s cubic-bezier(.3,.9,.3,1);max-height:80vh;display:flex;flex-direction:column;z-index:30}

.sheet-body{padding:6px 20px 24px;overflow-y:auto}
.sticky{padding:10px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#fff;flex:0 0 auto}
.sticky[hidden]{display:none}
.sticky button{width:100%;border:0;background:var(--ink);color:#fff;border-radius:14px;height:50px;font:700 14px 'Inter'}
.sheet h2{font:800 24px 'Inter Tight';letter-spacing:-.02em;margin:6px 0 2px}
.zone-tag{display:inline-flex;align-items:center;gap:6px;font:700 11px 'Inter';letter-spacing:.06em;text-transform:uppercase}
.zone-tag .dot{width:9px;height:9px;border-radius:50%}
.roomno{color:var(--ink-soft);font:500 14px 'Inter'}
.zdesc{margin-top:12px;font:500 13.5px/1.5 'Inter';color:var(--accent-ink);background:#FFF3B8;border-radius:14px;padding:12px 14px}
.hist{margin-top:8px;font:500 12.5px/1.5 'Inter';color:var(--ink-soft)}
.hist b{color:var(--ink)}
.more{display:inline-block;margin-top:10px;border:0;background:none;padding:0;font:700 13px 'Inter';color:var(--ink);
  text-decoration:underline;text-underline-offset:3px;text-decoration-color:#C9C9C4;text-decoration-thickness:1.5px}
.wiki-x{display:block;margin-top:8px;font:500 12.5px/1.5 'Inter';color:var(--ink-soft);border-left:2px solid var(--line);padding-left:10px}
.sec{font:700 11px 'Inter';letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 8px}

.tabs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.nav-search{width:100%;height:46px;border:0;border-radius:999px;padding:0 16px;font:500 15px 'Inter';

.rt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;

.rt-row{display:flex;align-items:center;gap:12px}

.thumb.rt-cov{width:64px;height:64px;border-radius:14px;flex:0 0 auto}
.rt b{display:block;font:800 16px/1.25 'Inter Tight'}
.rt .meta{display:block;font:700 11.5px 'Inter';color:var(--ink-soft);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.rt.hero .meta{color:var(--accent-ink);opacity:.6}
.rt .dsc{display:block;font:500 12.5px/1.45 'Inter';color:var(--ink-soft);margin-top:6px}
.rt.hero .dsc{color:var(--accent-ink);opacity:.8}
.cols{display:flex;flex-direction:column;gap:6px}
.col-row{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:#fff;

.col-row .bar{width:6px;align-self:stretch;border-radius:0 4px 4px 0;flex:0 0 auto;margin-right:8px}

  font:700 12.5px 'Inter';flex:0 0 auto}
.col-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:0;padding:0;text-align:left}

.col-row .tx{flex:1;min-width:0}
.col-row b{display:block;font:700 14px 'Inter'}
.col-row .tx span{font:500 12px 'Inter';color:var(--ink-soft);display:block;margin-top:1px}

.mp{display:block;padding:12px 0;border-bottom:1px solid var(--line)}

.mp-acts .fav.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.topic{background:#FFF3B8;border-radius:16px;padding:14px 16px;margin:10px 0}
.topic b{display:block;font:800 15px 'Inter Tight';color:var(--accent-ink)}
.topic span{display:block;font:500 12.5px/1.45 'Inter';color:var(--accent-ink);opacity:.85;margin-top:4px}
.tp-acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tp-acts button{border:0;background:var(--accent-ink);color:#fff;border-radius:999px;height:32px;padding:0 14px;font:700 12px 'Inter'}
.mp:last-child{border-bottom:0}
.mp .tx{flex:1;min-width:0}
.mp b{display:block;font:700 16px/1.3 'Inter'}
.mp span{font:500 12.5px 'Inter';color:var(--ink-soft)}
.mp .mpd{display:none;font:500 12.5px/1.45 'Inter';margin-top:3px}
.mp.open .mpd{display:block}

.mp .fav.on{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.hint{font:500 12.5px/1.45 'Inter';color:var(--ink-soft);margin:8px 0 4px}
.collect{width:100%;border:0;background:var(--ink);color:#fff;border-radius:14px;height:48px;

.quick{display:flex;gap:6px;overflow-x:auto;margin:10px 0 12px;scrollbar-width:none}
.quick::-webkit-scrollbar{display:none}

  padding:9px 14px;font:600 13px 'Inter';color:var(--ink)}
.mybtn{width:100%;border:0;background:var(--ink);color:#fff;border-radius:16px;padding:14px 16px;
  text-align:left;font:600 12.5px 'Inter';margin:2px 0 10px}
.mybtn b{display:block;font:800 16px 'Inter Tight';margin-bottom:2px}
.thumb{position:relative;width:56px;height:56px;border-radius:14px;overflow:hidden;background:var(--surface);flex:0 0 auto}
.thumb.big{width:100%;height:260px;border-radius:18px}
.thumb.big img{object-fit:cover}
.thumb.wide{width:104px;height:104px;border-radius:16px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.thumb img.ok{opacity:1}

.toast.show{opacity:1;transform:translateY(0)}

<body>

<header>
  <h1>Эрмитаж</h1>
  <div class="floors" id="floorTabs">
    <button data-f="1" onclick="setFloor(1)">1</button>
    <button data-f="2" class="on" onclick="setFloor(2)">2</button>
    <button data-f="3" onclick="setFloor(3)">3</button>
  </div>
</header>

<div class="controls">
  <button class="me-pill" id="mePill" onclick="openWhereAmI()">
    <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="10" r="3"/><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/></svg>
    <span id="meTx">Где я?</span>
  </button>
  <button class="btn-go" onclick="navScroll=0;navLastView=null;openNav('routes')">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 6h6.4l-5 4.3 1.8 6.7-5.8-4-5.8 4L8 13.3 3 9h6.4z"/></svg>
    Куда пойти
  </button>
</div>

<div class="legend" id="legend"></div>

<div class="mapwrap">
  <div class="target" id="target" hidden>
    <div class="t-tx"><span class="t-kind" id="tKind"></span><b id="tTitle"></b><span id="tSub"></span></div>
    <button id="tRoute" onclick="targetRoute()">Маршрут</button>
    <button onclick="hideTarget()">×</button>
  </div>
  <div id="stage"></div>
  <div class="tools">
    <div class="zoomgrp">
      <button class="zbtn" onclick="zoom(1.3)" title="Приблизить">+</button>
      <button class="zbtn" onclick="zoom(.77)" title="Отдалить">−</button>
    </div>
    <button id="btnTilt" onclick="toggleTilt()" title="Наклон карты">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button class="locate" id="btnLocate" onclick="locateMe()" title="Показать, где я"></button>
  </div>
  <div class="herebar" id="hereBar" hidden>
    <div class="hb-tx" onclick="if(here)selectRoom(here)">
      <b id="hbTitle"></b><span id="hbSub"></span>
      <button class="trk" id="trkChip2" onclick="trkTap();event.stopPropagation()"></button>
      <button class="hb-story" id="hbStory" hidden onclick="openWork(+this.dataset.i);event.stopPropagation()">★ Узнать</button>
    </div>
    <button class="hb-go" onclick="navScroll=0;navLastView=null;openNav('routes')">Куда пойти</button>
  </div>
  <div class="resume" id="resume" hidden>
    <button class="rs-main" onclick="expandFollow()"><b id="rsTx"></b><span>вернуться к маршруту</span></button>
    <button class="rs-x" onclick="stopFollow()" title="Завершить маршрут">×</button>
  </div>
  <div class="follow" id="follow" hidden>
    <div class="f-grab" onclick="toggleFollowDetails(event)"></div>
    <button class="story" id="storyChip" hidden></button>
    <div class="f-mini" onclick="toggleFollowDetails(event)">
      <div class="f-mtx">
        <b id="fGoTo"></b>
        <span id="fMeta"></span>
        <button class="trk" id="trkChip" onclick="trkTap();event.stopPropagation()"></button>
      </div>
      <button class="f-go" id="fNext">Я перешла</button>
      <button class="f-chev" id="fChev" onclick="askStopFollow();event.stopPropagation()">×</button>
    </div>
    <div class="f-confirm" id="fConfirm" hidden>
      <b>Завершить маршрут?</b>
      <button class="cf-no" onclick="hideConfirm()">Отмена</button>
      <button class="cf-yes" onclick="stopFollow()">Завершить</button>
    </div>
    <div class="f-more" id="fMore" hidden>
      <div class="f-goal" id="fGoal"></div>
      <div class="f-list" id="fList"></div>
      <span id="fHere" hidden></span><span id="fWorks" hidden></span>
      <span id="fInfo" hidden></span><span id="fStops" hidden></span>
    </div>
  </div>
</div>

<div class="welcome" id="welcome">
  <div class="w-card">
    <h2>Вы в Эрмитаже?</h2>
    <p>Подскажу, что смотреть, и доведу до каждого зала по номерам на табличках.</p>
    <button class="w-main" onclick="startAtEntrance()">Я у главного входа</button>
    <button class="w-sec" onclick="hideWelcome();openWhereAmI()">Уже гуляю по залам</button>
    <button class="w-ghost" onclick="hideWelcome()">Просто посмотреть карту</button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="grab"></div><div class="sheet-body" id="sheetBody"></div>
<div class="sticky" id="sheetSticky" hidden></div></div>
<div class="toast" id="toast"></div>

document.addEventListener('touchend',e=>{

},{passive:false});

/* середина общей стены = дверь; линия идёт зал → дверь → зал */
function doorPoint(a,b){
  const A=rectOf(a,FLOOR),B=rectOf(b,FLOOR);
  if(!A||!B)return null;
  const ox1=Math.max(A.x,B.x),ox2=Math.min(A.x+A.w,B.x+B.w);
  const oy1=Math.max(A.y,B.y),oy2=Math.min(A.y+A.h,B.y+B.h);
  if(ox2-ox1>=6&&Math.abs((A.y+A.h)-B.y)<6)return[(ox1+ox2)/2,B.y];
  if(ox2-ox1>=6&&Math.abs((B.y+B.h)-A.y)<6)return[(ox1+ox2)/2,A.y];
  if(oy2-oy1>=6&&Math.abs((A.x+A.w)-B.x)<6)return[B.x,(oy1+oy2)/2];
  if(oy2-oy1>=6&&Math.abs((B.x+B.w)-A.x)<6)return[A.x,(oy1+oy2)/2];
  return null;
}

  let d='',open=false;
  for(let i=0;i<routePath.length;i++){
    const n=routePath[i];
    if(!visibleOn(n,FLOOR)){open=false;continue}
    const c=ctr(n);
    d+= (open?' L':' M')+c[0].toFixed(1)+','+c[1].toFixed(1);
    open=true;
    const m=routePath[i+1];
    if(m!=null&&visibleOn(m,FLOOR)){
      const dp=doorPoint(n,m);
      if(dp)d+=' L'+dp[0].toFixed(1)+','+dp[1].toFixed(1);
    }
  }

}

function paint(){
  Object.keys(roomEls).forEach(k=>{
    const n=+k,e=roomEls[n],r=roomByN[n],z=r.pos?null:r.z;
    const onRoute=routePath.includes(n);
    const dimZ=zoneFilter&&z&&z!==zoneFilter&&!onRoute&&here!==n;
    const dimR=routePath.length>1&&!onRoute&&n!==targetRoom&&!(zoneFilter&&z===zoneFilter);
    e.classList.toggle('dim',!!(dimZ||dimR));
    e.classList.toggle('route',routePath.includes(n));
    e.classList.toggle('sel',selected===n);
    e.classList.toggle('me',here===n);
    e.setAttribute('fill-opacity',here===n?.34:selected===n?.30:routePath.includes(n)?.24:.16);
  });
  routeEl.setAttribute('d',routePath.length>1?routeD():'');
  drawFloorTags();
  const show=here&&visibleOn(here,FLOOR);
  hereDot.setAttribute('display',show?'':'none');
  herePulse.setAttribute('display',show?'':'none');
  let cone=false;
  if(show){
    const rr=rectOf(here,FLOOR);
    meGlow.setAttribute('display','');
    meGlow.setAttribute('x',rr.x-2);meGlow.setAttribute('y',rr.y-2);
    meGlow.setAttribute('width',rr.w+4);meGlow.setAttribute('height',rr.h+4);
    /* если слежение работает — рисуем реальную оценку внутри зала */
    let cx,cy;
    if(typeof autoPos!=='undefined'&&autoPos&&typeof est!=='undefined'&&est
       &&est.x>=rr.x-2&&est.x<=rr.x+rr.w+2&&est.y>=rr.y-2&&est.y<=rr.y+rr.h+2){
      cx=Math.max(rr.x+5,Math.min(est.x,rr.x+rr.w-5));
      cy=Math.max(rr.y+5,Math.min(est.y,rr.y+rr.h-5));
    }else{[cx,cy]=ctr(here)}
    hereDot.setAttribute('cx',cx);hereDot.setAttribute('cy',cy);
    herePulse.setAttribute('cx',cx);herePulse.setAttribute('cy',cy);
    let th=null;
    if(orientMode==='compass'&&compassSmooth!=null){
      th=(-90-rot)*Math.PI/180;                    /* куда смотрит телефон = вверх экрана */
    }else{
      const i=routePath.indexOf(here);
      if(i>=0&&i+1<routePath.length&&visibleOn(routePath[i+1],FLOOR)){
        const[nx,ny]=ctr(routePath[i+1]);th=Math.atan2(ny-cy,nx-cx);
      }
    }
    if(th!==null){
      const R=40,ph=Math.PI/7;
      coneEl.setAttribute('d',`M${cx},${cy} L${cx+R*Math.cos(th-ph)},${cy+R*Math.sin(th-ph)} A${R},${R} 0 0 1 ${cx+R*Math.cos(th+ph)},${cy+R*Math.sin(th+ph)} Z`);
      coneEl.setAttribute('display','');cone=true;
    }
  }
  if(!show)meGlow.setAttribute('display','none');
  if(!cone)coneEl.setAttribute('display','none');
}

function zoneRoom(z){

function fitZone(z){
  const list=ROOMS.filter(r=>r.z===z&&r.f===FLOOR);
  if(!list.length)return;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  list.forEach(r=>{x1=Math.min(x1,r.x);y1=Math.min(y1,r.y);x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h)});
  const W=stage.clientWidth,H=stage.clientHeight,k=Math.min(W/900,H/600),ox=(W-900*k)/2,oy=(H-600*k)/2;
  scale=Math.min(1.9,Math.max(.7,.8*Math.min(900/(x2-x1),600/(y2-y1))));
  tx=(W/2-ox)/k-scale*(x1+x2)/2;ty=(H/2-oy)/k-scale*(y1+y2)/2;clampT();applyT(true);
}

/* пан/зум/поворот */
function applyT(anim){g.style.transition=anim?'transform .45s cubic-bezier(.3,.9,.35,1)':'none';
  g.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function applyView(anim=true){
  svg.style.transition=anim?'transform .6s cubic-bezier(.3,.9,.35,1)':'none';
  svg.style.transformOrigin='50% 50%';
  svg.style.transform=(tilt?'perspective(1200px) rotateX(42deg) ':'')+`rotateZ(${rot}deg)`;
  labelEls.forEach(l=>l.e.setAttribute('transform',`rotate(${l.base-rot} ${l.x} ${l.y})`));
}
function clampT(){
  const W=stage.clientWidth,H=stage.clientHeight;
  const k=Math.min(W/900,H/600);
  const vw=W/k, vh=H/k;                       /* видимая область в единицах схемы */
  const mw=900*scale, mh=600*scale;
  const minX=Math.min(vw*0.25-mw, vw*0.75-mw), maxX=vw*0.75;
  const minY=Math.min(vh*0.25-mh, vh*0.75-mh), maxY=vh*0.75;
  tx=Math.max(minX,Math.min(tx,maxX));
  ty=Math.max(minY,Math.min(ty,maxY));
}
/* перевод экранной точки в координаты схемы с учётом поворота */
function screenToVb(sx,sy){
  const r=stage.getBoundingClientRect();
  const W=stage.clientWidth,H=stage.clientHeight,k=Math.min(W/900,H/600);
  const ox=(W-900*k)/2, oy=(H-600*k)/2;
  let x=(sx-r.left-ox)/k, y=(sy-r.top-oy)/k;
  const a=-rot*Math.PI/180, cx=450, cy=300;
  const dx=x-cx, dy=y-cy;
  return [cx+dx*Math.cos(a)-dy*Math.sin(a), cy+dx*Math.sin(a)+dy*Math.cos(a)];
}
function zoomAt(f,sx,sy){
  const old=scale;
  scale=Math.min(3.2,Math.max(.55,scale*f));
  if(scale===old)return;
  if(sx!=null){
    const [px,py]=screenToVb(sx,sy);
    const mx=(px-tx)/old, my=(py-ty)/old;     /* точка в координатах схемы */
    tx=px-mx*scale; ty=py-my*scale;
  }
  clampT();applyT();
}
function zoom(f){
  const r=stage.getBoundingClientRect();
  zoomAt(f, r.left+r.width/2, r.top+r.height/2);
}
function centerOn(n,sc){
  if(!visibleOn(n,FLOOR))return;
  const[px,py]=ctr(n),W=stage.clientWidth,H=stage.clientHeight;
  const k=Math.min(W/900,H/600),ox=(W-900*k)/2,oy=(H-600*k)/2;
  scale=sc||scale;tx=(W/2-ox)/k-scale*px;ty=(H/2-oy)/k-scale*py;applyT(true);
}
function fitRoute(){
  const ns=routePath.filter(n=>visibleOn(n,FLOOR));if(ns.length<2)return;
  let x1=1e9,y1=1e9,x2=-1e9,y2=-1e9;
  ns.forEach(n=>{const r=rectOf(n,FLOOR);x1=Math.min(x1,r.x);y1=Math.min(y1,r.y);
    x2=Math.max(x2,r.x+r.w);y2=Math.max(y2,r.y+r.h)});
  const W=stage.clientWidth,H=stage.clientHeight,k=Math.min(W/900,H/600),ox=(W-900*k)/2,oy=(H-600*k)/2;
  scale=Math.min(1.7,Math.max(.65,.75*Math.min(900/(x2-x1),600/(y2-y1))));
  tx=(W/2-ox)/k-scale*(x1+x2)/2;ty=(H/2-oy)/k-scale*(y1+y2)/2;clampT();applyT(true);
}
/* Ориентация карты: по маршруту → по компасу → фиксированно.
   MAP_NORTH — азимут, которому соответствует «вверх» на нашей схеме
   (сторона Невы). Подбирается один раз на месте калибровкой. */
let orientMode='route', MAP_NORTH=0, compassRaw=null, compassSmooth=null;
function toggleTilt(){
  tilt=!tilt;document.getElementById('btnTilt').classList.toggle('on',tilt);applyView();
}
let compassTried=false,compassEverOn=false;
async function autoCompass(){
  if(compassTried||orientMode==='compass')return;
  compassTried=true;
  const ok=await startCompass();
  if(ok){orientMode='compass';compassEverOn=true;renderLocateBtn();updateRose();paint();
    const auto=await enableAutoPos();
    toast('Карта крутится за телефоном')}
}
async function startCompass(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted')return false;
    }
    window.addEventListener('deviceorientationabsolute',onCompass,true);
    window.addEventListener('deviceorientation',onCompass,true);
    return true;
  }catch(e){return false}
}
function stopCompass(){
  window.removeEventListener('deviceorientationabsolute',onCompass,true);
  window.removeEventListener('deviceorientation',onCompass,true);
  compassRaw=null;compassSmooth=null;
}
function onCompass(e){
  let h=null;
  if(e.webkitCompassHeading!=null)h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null)h=360-e.alpha;
  else if(e.alpha!=null)h=360-e.alpha;
  if(h==null||isNaN(h))return;
  compassRaw=h;
  /* сглаживание по кратчайшей дуге, чтобы карта не дрожала */
  if(compassSmooth==null)compassSmooth=h;
  else{let d=((h-compassSmooth+540)%360)-180;compassSmooth=(compassSmooth+d*0.18+360)%360}
  if(orientMode==='compass'){
    const target=-(compassSmooth-MAP_NORTH);
    if(Math.abs(((target-rot+540)%360)-180)>1.2){rot=target;applyView(false);updateRose();paint()}
  }
}
function updateRose(){ renderLocateBtn(); }
function updateHeading(){
  if(orientMode==='compass'){updateRose();return}
  if(orientMode==='route'&&followActive&&followIdx+1<routePath.length
     &&visibleOn(here,FLOOR)&&visibleOn(routePath[followIdx+1],FLOOR)){
    const[ax,ay]=ctr(here),[bx,by]=ctr(routePath[followIdx+1]);
    rot=-90-Math.atan2(by-ay,bx-ax)*180/Math.PI;
  }else rot=0;
  applyView();updateRose();
  if(followActive&&here&&visibleOn(here,FLOOR))centerOn(here,Math.max(scale,1.3));
}

stage.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,tx,ty};stage.setPointerCapture(e.pointerId);

  const k=Math.min(stage.clientWidth/900,stage.clientHeight/600);
  tx=drag.tx+(dx*c+dy*s)/k;ty=drag.ty+(-dx*s+dy*c)/k;clampT();applyT()});

let pinch=null,twist=null,twistAcc=0;
stage.addEventListener('touchstart',e=>{if(e.touches.length===2){drag=null;twistAcc=0}},{passive:true});
stage.addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    drag=null;
    const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)*180/Math.PI;
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2;
    const my=(e.touches[0].clientY+e.touches[1].clientY)/2;
    if(pinch&&Math.abs(d-pinch)>1)zoomAt(d/pinch,mx,my);
    if(twist!=null){
      let dd=ang-twist;while(dd>180)dd-=360;while(dd<-180)dd+=360;
      if(Math.abs(dd)>0.4){
        twistAcc+=Math.abs(dd);
        if(orientMode==='compass'&&twistAcc<28){/* мелкий доворот при щипке — игнорируем */}
        else{
          if(orientMode==='compass'){orientMode='fixed';stopCompass();renderLocateBtn();renderTrk();
            toast('Вы повернули карту вручную. Вернуть слежение — кнопкой внизу справа');}
          rot+=dd;applyView(false);updateRose();

    }
    pinch=d;twist=ang;e.preventDefault();
  }},{passive:false});

const thumbCache={},extCache={};
async function wiki(q,mode,exact){
  const cache=mode==='img'?thumbCache:extCache;
  const key=(exact?'T:':'S:')+q;
  if(key in cache)return cache[key];
  const props=mode==='img'?'pageimages&piprop=thumbnail&pithumbsize=520':'extracts&exintro&explaintext&exsentences=4';
  const base='https://ru.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop='+props;
  const url=exact? base+'&titles='+encodeURIComponent(q)
                 : base+'&generator=search&gsrlimit=1&gsrsearch='+encodeURIComponent(q);
  try{
    const j=await (await fetch(url)).json();
    const pg=j.query&&j.query.pages?Object.values(j.query.pages)[0]:null;
    const v=!pg||pg.missing!==undefined?null:(mode==='img'
      ?(pg.thumbnail&&pg.thumbnail.source)||null
      :(pg.extract?pg.extract.slice(0,600):null));
    cache[key]=v;return v;
  }catch(e){cache[key]=null;return null}
}

const GEO={lonW:30.3060,lonE:30.3168,latN:59.9418,latS:59.9395,xW:20,xE:880,yN:40,yS:560,mPerPx:.84};
function tryGeo(){
  if(!navigator.geolocation){toast('Геолокация недоступна');return}
  toast('Определяю позицию…');
  navigator.geolocation.getCurrentPosition(p=>{
    const{latitude:la,longitude:lo,accuracy:ac}=p.coords;
    const x=GEO.xW+(lo-GEO.lonW)/(GEO.lonE-GEO.lonW)*(GEO.xE-GEO.xW);
    const y=GEO.yN+(GEO.latN-la)/(GEO.latN-GEO.latS)*(GEO.yS-GEO.yN);
    geoBlob.setAttribute('cx',x);geoBlob.setAttribute('cy',y);
    geoBlob.setAttribute('r',Math.min(420,Math.max(8,ac/GEO.mPerPx)));
    toast(`Точность ±${Math.round(ac)} м — этаж и зал так не определить`);
  },e=>toast(e.code===1?'Нет разрешения на геолокацию':'Не удалось определить'),{enableHighAccuracy:true,timeout:10000});
}

/* ================== МАРШРУТ ================== */
/* цена прохода: служебные, закрытые и временные залы обходим, если можно */
function costOf(n){
  const r=roomByN[n];
  if(!r||r.pos)return 1;                 /* лестницы — обычный проход */
  if(r.z==='closed')return 10;           /* закрытые залы обходим */
  if(r.z==='temp')return 2;              /* временные выставки — чуть дороже */
  return 1;                              /* сервисные галереи и кафе — нормальный путь */
}
function findRoute(a,b){
  if(a===b)return[a];
  const dist={[a]:0},prev={[a]:null},seen={};
  while(true){
    let v=null,best=Infinity;
    for(const k in dist){if(!seen[k]&&dist[k]<best){best=dist[k];v=+k}}
    if(v===null)break;
    if(v===b){const p=[b];let c=b;while(prev[c]!==null){c=prev[c];p.unshift(c)}return p}
    seen[v]=1;
    for(const w of(adj[v]||[])){
      const d=dist[v]+costOf(w);
      if(dist[w]===undefined||d<dist[w]){dist[w]=d;prev[w]=v}
    }
  }
  return null;
}
function resumePending(p){
  if(typeof p==='number')routeTo(p);
  else if(p.my)startMyRoute();
  else if(p.am)goAmenity(p.am,p.l);
  else startRoute(p.r);
}

        Можно заглянуть в «${roomByN[n].name}» и вернуться.</p>
      <div class="dlg-acts">
        <button class="w-main" onclick="detourTo(${n},${prev},${prevW==null?'null':prevW})">Зайти и вернуться</button>
        <button class="w-sec" onclick="replaceGoal(${n})">Сделать новой целью</button>
        <button class="w-ghost" onclick="closeSheet()">Отмена</button>
      </div>`;

  }
  routeTo(n);
}

function routeTo(n){
  if(goalWork!=null&&WORKS[goalWork].room!==n)goalWork=null;

  closeSheet();
  if(zoneFilter){zoneFilter=null;buildLegend()}   /* подсветка коллекции не остаётся висеть */
  routePath=p;selected=n;targetRoom=n;
  const r=roomByN[n];
  document.getElementById('target').hidden=true;   /* во время маршрута ведёт нижняя панель */

let tourSeen=[],tourName='';
function startRoute(i){
  const R=ROUTES[i];tourSeen=[];
  if(!here){pendingGo={r:i};openWhereAmI();return}
  tourStops=R.s.slice();tourIdx=0;arrivalShown=false;tourName=R.t;
  while(tourIdx<tourStops.length-1&&tourStops[tourIdx]===here)tourIdx++;
  closeSheet();routeTo(tourStops[tourIdx]);

  toast('Поехали: '+R.s.length+' остановок, первая — '+(roomByN[tourStops[tourIdx]].name));
}
function nextStop(){
  arrivalShown=false;
  const w0=(worksByRoom[tourStops[tourIdx]]||[])[0];
  if(w0)tourSeen.push(WORKS.indexOf(w0));
  tourIdx++;
  while(tourIdx<tourStops.length-1&&tourStops[tourIdx]===here)tourIdx++;
  if(tourStops[tourIdx]===here){          /* уже стоим на следующей остановке */
    if(tourIdx>=tourStops.length-1){const n=tourStops.length;stopFollow();paint();finishTour(n);return}
    tourIdx++;
  }
  routeTo(tourStops[tourIdx]);
}

/* ============ АВТОПОЛОЖЕНИЕ: шаги + компас + привязка к плану ============
   Считаем шаги акселерометром, направление берём с компаса и ведём точку
   по схеме. Как только точка выходит за границу зала — ищем, в какую из
   соседних дверей она вышла, и переставляем позицию сами.
   Точность не абсолютная: это оценка, которую всегда можно поправить. */
let autoPos=true, steps=0, lastPeak=0, accWin=[], est=null, autoMoves=0;
const M_PER_UNIT=0.30, STEP_M=0.7;
const STEP_U=STEP_M/M_PER_UNIT;

let stairSteps=0;
function otherFloor(n){
  const st=roomByN[n];if(!st||!st.pos)return null;
  const fs=Object.keys(st.pos).map(Number).filter(f=>f!==FLOOR);
  return fs.length?fs[0]:null;
}
function maybeChangeFloor(){
  if(!isStair(here))return false;
  stairSteps++;
  if(stairSteps<16)return false;              /* примерно пролёт лестницы */
  const f=otherFloor(here);
  if(!f)return false;
  stairSteps=0;setFloor(f);resetEst();paint();
  if(followActive)updateFollow();
  toast('Похоже, вы перешли на '+f+' этаж');
  if(navigator.vibrate)navigator.vibrate(40);
  return true;
}
function resetEst(){
  walkDist=0;stairSteps=0;
  const r=here?rectOf(here,FLOOR):null;
  est=r?{x:r.x+r.w/2,y:r.y+r.h/2}:null;
  steps=0;
}
async function enableAutoPos(){
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){
      const r=await DeviceMotionEvent.requestPermission();
      if(r!=='granted')return false;
    }
    window.addEventListener('devicemotion',onMotion);
    resetEst();return true;
  }catch(e){return false}
}
function onMotion(e){
  if(!autoPos||!here)return;
  const a=e.accelerationIncludingGravity;if(!a)return;
  const m=Math.hypot(a.x||0,a.y||0,a.z||0);
  accWin.push(m);if(accWin.length>12)accWin.shift();
  const avg=accWin.reduce((x,y)=>x+y,0)/accWin.length;
  const now=Date.now();
  if(m-avg>1.55&&now-lastPeak>300){lastPeak=now;steps++;onStep()}
}
function segMetersToNext(){
  if(!followActive||followIdx+1>=routePath.length)return null;
  const a=ctr(here),b=ctr(routePath[followIdx+1]);
  if(!a||!b)return null;
  return Math.hypot(b[0]-a[0],b[1]-a[1])*M_PER_UNIT;
}
let walkDist=0;
function onStep(){
  if(isStair(here)&&maybeChangeFloor())return;   /* сначала проверяем лестницу */
  /* без компаса: идём по маршруту и меняем зал, когда прошли расстояние до него */
  if(compassSmooth==null){
    walkDist+=STEP_M;
    const need=segMetersToNext();
    if(need&&walkDist>=need*0.9){
      walkDist=0;steps=0;autoMoves++;
      advanceFollow();

    }
    updateAutoLine();return;
  }
  if(!est){resetEst();if(!est)return}
  const hd=(compassSmooth-MAP_NORTH)*Math.PI/180;   /* 0° = север = вверх схемы */
  est.x+=Math.sin(hd)*STEP_U;
  est.y-=Math.cos(hd)*STEP_U;
  const r=rectOf(here,FLOOR);if(!r)return;
  const inside=est.x>=r.x&&est.x<=r.x+r.w&&est.y>=r.y&&est.y<=r.y+r.h;
  if(inside){paint();updateAutoLine();return}
  /* вышли за пределы зала — ищем, в какую соседнюю дверь */
  let best=null,bd=1e9;
  (adj[here]||[]).forEach(n=>{
    if(!visibleOn(n,FLOOR))return;
    const q=rectOf(n,FLOOR);
    const cx=Math.max(q.x,Math.min(est.x,q.x+q.w)),cy=Math.max(q.y,Math.min(est.y,q.y+q.h));
    const d=Math.hypot(est.x-cx,est.y-cy);
    if(d<bd){bd=d;best=n}
  });
  if(best!==null&&bd<26&&steps>=3){
    here=best;autoMoves++;updatePill();
    const q=rectOf(best,FLOOR);
    est.x=Math.max(q.x+4,Math.min(est.x,q.x+q.w-4));
    est.y=Math.max(q.y+4,Math.min(est.y,q.y+q.h-4));
    if(followActive){
      const i=routePath.indexOf(best);
      if(i>=0)followIdx=i;
      else if(targetRoom&&targetRoom!==best)routeTo(targetRoom);
    }
    paint();if(orientMode==='compass'||locCentered)centerOn(here,Math.max(scale,1.4));
    if(followActive)updateFollow();
    if(navigator.vibrate)navigator.vibrate(30);
    const w=(worksByRoom[best]||[])[0];
    toast(`Зал ${best}${w?' · '+w.t:''}`);
  }else{
    est.x=Math.max(r.x+3,Math.min(est.x,r.x+r.w-3));
    est.y=Math.max(r.y+3,Math.min(est.y,r.y+r.h-3));
  }
  updateAutoLine();
}

/* порядок обхода: ближайший сосед + улучшение 2-opt (в среднем в пределах 2% от оптимума) */
const _dcache={};
function walkLen(a,b){
  const k=a+'_'+b;
  if(_dcache[k]===undefined){const p=findRoute(a,b);_dcache[k]=p?p.length-1:9999}
  return _dcache[k];
}
function orderStops(start,pts){
  let cur=start,left=pts.slice(),order=[];
  while(left.length){                       /* 1. жадно: ближайший невзятый */
    let bi=0,bd=1e9;
    left.forEach((r,i)=>{const d=walkLen(cur,r);if(d<bd){bd=d;bi=i}});
    cur=left[bi];order.push(cur);left.splice(bi,1);
  }
  const len=o=>{let c=0,p=start;o.forEach(r=>{c+=walkLen(p,r);p=r});return c};
  let best=len(order),improved=true,guard=0;
  while(improved&&guard++<60){              /* 2. 2-opt: разворачиваем куски пути */
    improved=false;
    for(let i=0;i<order.length-1;i++)for(let j=i+1;j<order.length;j++){
      const cand=order.slice();
      cand.splice(i,j-i+1,...cand.slice(i,j+1).reverse());
      const l=len(cand);
      if(l<best-1e-9){order=cand;best=l;improved=true}
    }
  }
  return{order,total:best};
}

  tourStops=order;tourIdx=0;arrivalShown=false;tourName='Мой маршрут';

}

      +(ql.length>=3?`<button class="collect" style="background:var(--surface);color:var(--ink)" onclick="searchCollection('${ql.replace(/'/g,'')}')">Поискать «${ql}» во внешних базах</button><div id="wdBox"></div>`:'')
      ;
    body=body.replace('<input class="nav-search"','<div class="hint">Отмечайте кнопкой «в путь» всё, что хотите увидеть, — соберу из этого один маршрут в удобном порядке.</div><input class="nav-search"');
  }
  sheetBody.innerHTML=body;sheet.classList.add('open','fixed');sheet.classList.toggle('tall',navTall);
  hydrate(sheetBody);syncSticky();
  sheetBody.scrollTop=navScroll||0;
  if(!navScrollBound){navScrollBound=true;
    sheetBody.addEventListener('scroll',()=>{if(sheet.classList.contains('fixed'))navScroll=sheetBody.scrollTop})}
  const s=document.getElementById('navS');
  if(s){s.addEventListener('input',()=>{navScroll=0;openNav('works',s.value)});
    if(q){s.focus();s.setSelectionRange(q.length,q.length)}}
}
function focusWork(i){const w=WORKS[i];focusRoom(w.room,w.t)}
/* «пойдём» к конкретной вещи: помним, ради чего идём */
function goToWork(i){
  const w=WORKS[i];goalWork=i;
  routeOrAsk(w.room);
}
function openWork(i,onTour){
  const w=WORKS[i],r=roomByN[w.room],z=ZONES[r.z];
  sheet.classList.remove('fixed');
  sheetBody.innerHTML=`
    ${thumbHTML(w,'big')}
    <div class="zone-tag" style="color:${z.c};margin-top:12px">
      <span class="dot" style="background:${z.c}"></span>${z.n}</div>
    <h2>${w.t}</h2>
    <div class="roomno">${w.a} · зал ${w.room} · ${r.f} этаж · ${r.name}</div>
    <div class="zdesc">${w.d}</div>
    ${HIST[w.room]?`<div class="hist"><b>О зале.</b> ${HIST[w.room]}</div>`:''}
    <button class="more" data-q="${w.wt||w.q}" data-exact="${w.wt?1:0}" onclick="moreInfo(this)">Подробнее</button>
    <button class="more" style="margin-left:14px" data-q="${(w.a||'').split(',')[0]}" data-exact="0" onclick="moreInfo(this)">Об авторе</button>
    <div class="acts">
      ${onTour?`<button class="prim" onclick="closeSheet();arrivalShown=false;nextStop()">Дальше по маршруту →</button>`
        :`<button class="prim" onclick="goToWork(${i})">Пойдём</button>
          <button onclick="focusWork(${i})">На карте</button>`}
    </div>
    <div class="acts" style="margin-top:8px">
      <button onclick="toggleFav(${i},this);this.textContent=favs.has(${i})?'✓ в маршруте':'+ в мой маршрут'">${favs.has(i)?'✓ в маршруте':'+ в мой маршрут'}</button>
    </div>`;
  document.getElementById('sheetSticky').hidden=true;
  sheet.classList.add('open');hydrate(sheetBody);
}
function openTourList(){
  if(!tourStops)return;
  sheet.classList.add('fixed');
  sheetBody.innerHTML=`<h2>Остановки маршрута</h2>
   <div class="empty" style="margin-top:2px">Пройдено ${tourIdx} из ${tourStops.length}</div>`
   +tourStops.map((r,i)=>{
     const rm=roomByN[r],w=(worksByRoom[r]||[])[0];
     const st=i<tourIdx?'done':(i===tourIdx?'cur':'');
     return `<div class="mp">
       <span class="st-d ${st}" style="width:28px;height:28px">${i<tourIdx?'✓':i+1}</span>
       <div class="tx"><b>${w?w.t:rm.name}</b><span>зал ${r} · ${rm.f} этаж${i===tourIdx?' · сейчас идём сюда':''}</span></div>
       ${i!==tourIdx?`<button onclick="jumpStop(${i})">${i<tourIdx?'вернуться':'сразу сюда'}</button>`:''}
     </div>`}).join('');
  document.getElementById('sheetSticky').hidden=true;
  sheet.classList.add('open');
}
function finishTour(n){
  sheet.classList.remove('fixed');
  const seen=(tourSeen||[]).filter((v,i,a)=>a.indexOf(v)===i);
  sheetBody.innerHTML=`<h2>Маршрут пройден</h2>
   <div class="zdesc">Все ${n} остановок позади. Карта останется под рукой — можно просто побродить.</div>
   ${seen.length?`<div class="sec">Что вы посмотрели</div>`+seen.map(i=>`
     <div class="mp"><div class="mp-top" onclick="openWork(${i})">${thumbHTML(WORKS[i])}
       <div class="tx"><b>${WORKS[i].t}</b><span>${WORKS[i].a}</span></div></div></div>`).join(''):''}
   <div class="acts"><button onclick="closeSheet()">Закрыть</button>
   <button class="prim" onclick="openNav('routes')">Другой маршрут</button></div>`;
  document.getElementById('sheetSticky').hidden=true;
  sheet.classList.add('open');
}
function jumpStop(i){
  if(!tourStops)return;
  tourIdx=i;closeSheet();routeTo(tourStops[i]);
}

/* ---- поиск по всему собранию (Wikidata: предметы, чья коллекция — Эрмитаж) ----
   Wikidata знает автора и изображение, но НЕ знает номер зала.
   Поэтому зал подбираем по автору из нашей размеченной базы. */
const authorRoom={};
WORKS.forEach(w=>{(w.a||'').split(/[,·]/).forEach(part=>{
  const key=part.trim().toLowerCase();
  if(key.length>4&&!(key in authorRoom))authorRoom[key]=w.room;
})});
function roomForAuthor(name){
  if(!name)return null;
  const words=name.toLowerCase().match(/[а-яёa-z]{5,}/g)||[];
  for(const k in authorRoom){
    const keys=(k.match(/[а-яёa-z]{5,}/g)||[]);
    if(keys.some(kk=>words.includes(kk)))return authorRoom[k];
  }
  return null;
}
/* запасной поиск — по статьям Википедии про эрмитажные вещи */
async function wikiFallback(q){
  const box=document.getElementById('wdBox');if(!box)return;
  try{
    const u='https://ru.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=6'
      +'&prop=pageimages|extracts&piprop=thumbnail&pithumbsize=200&exintro&explaintext&exsentences=1'
      +'&format=json&origin=*&gsrsearch='+encodeURIComponent(q+' Эрмитаж');
    const j=await (await fetch(u)).json();
    const pages=j.query?Object.values(j.query.pages):[];
    if(!pages.length){box.innerHTML='<div class="empty">Ничего не нашлось по этому запросу.</div>';return}
    const rel=pages.filter(p=>/эрмитаж/i.test((p.extract||'')+' '+p.title));
    if(!rel.length){box.innerHTML='<div class="empty">В открытых источниках ничего эрмитажного не нашлось. Попробуйте название произведения или имя художника.</div>';return}
    box.innerHTML='<div class="sec">Возможно, вы искали это</div>'+rel.map(p=>{
      const rm=roomForAuthor(p.title)||roomForAuthor((p.extract||'').slice(0,120));
      return `<div class="mp">
        <div class="thumb">${p.thumbnail?`<img class="ok" src="${p.thumbnail.source}" alt="">`:`<span class="ph">${p.title[0]}</span>`}</div>
        <div class="tx"><b>${p.title}</b><span>${(p.extract||'').slice(0,80)}${rm?' · вероятно зал '+rm:''}</span></div>
        ${rm?`<button onclick="focusRoom(${rm})">Где это</button>`:''}</div>`}).join('')
      +'<div class="empty">Это справка из открытых источников: номер зала известен только для размеченных нами произведений.</div>';
  }catch(e){box.innerHTML='<div class="empty">Не удалось выполнить поиск — нужна сеть.</div>'}
}
let wdBusy=false;
async function searchCollection(q){
  if(wdBusy||!q||q.trim().length<3)return;
  wdBusy=true;
  const box=document.getElementById('wdBox');
  if(box)box.innerHTML='<div class="empty">Ищу в собрании музея…</div>';
  const sparql=`SELECT ?item ?itemLabel ?creatorLabel ?img WHERE {
    SERVICE wikibase:mwapi { bd:serviceParam wikibase:api "EntitySearch";
      wikibase:endpoint "www.wikidata.org"; mwapi:search "${q.replace(/"/g,'')}";
      mwapi:language "ru". ?item wikibase:apiOutputItem mwapi:item. }
    ?item wdt:P195 wd:Q132783 .
    OPTIONAL { ?item wdt:P170 ?creator }
    OPTIONAL { ?item wdt:P18 ?img }
    SERVICE wikibase:label { bd:serviceParam wikibase:language "ru,en" }
  } LIMIT 8`;
  try{
    const ctrl=new AbortController();setTimeout(()=>ctrl.abort(),9000);
    const r=await fetch('https://query.wikidata.org/sparql?format=json&query='+encodeURIComponent(sparql),
      {headers:{'Accept':'application/sparql-results+json'},signal:ctrl.signal});
    const j=await r.json();
    const rows=j.results.bindings;
    if(!box)return;
    if(!rows.length){wikiFallback(q);return}
    box.innerHTML=`<div class="sec">Из собрания музея</div>`+rows.map(b=>{
      const t=b.itemLabel?b.itemLabel.value:'Без названия';
      const a=b.creatorLabel?b.creatorLabel.value:'';
      const im=b.img?b.img.value+'?width=200':'';
      const rm=roomForAuthor(a);
      return `<div class="mp">
        <div class="thumb">${im?`<img class="ok" src="${im}" alt="">`:`<span class="ph">${(a||t)[0]}</span>`}</div>
        <div class="tx"><b>${t}</b><span>${a||'автор неизвестен'}${rm?' · вероятно зал '+rm:' · зал неизвестен'}</span></div>
        ${rm?`<button onclick="focusRoom(${rm},'${t.replace(/'/g,'')}')">Где это</button>`:''}
      </div>`}).join('')
      +`<div class="empty">Номер зала есть только у размеченных нами произведений: у остальных он подобран по автору и может быть неточным.</div>`;
  }catch(e){ wikiFallback(q);
  }finally{wdBusy=false}
}
function routeToCollection(i){
  const c=COLLECTIONS[i];
  zoneFilter=c.z;
  if(!here){pendingGo=c.room;closeSheet();openWhereAmI();return}
  if(FLOOR!==c.f)setFloor(c.f);
  buildLegend();
  routeTo(c.room);
}
function goCollection(i){
  const c=COLLECTIONS[i];zoneFilter=c.z;
  if(FLOOR!==c.f)setFloor(c.f);
  buildLegend();closeSheet();paint();showZoneBar();
}

buildFloor();buildLegend();updatePill();applyView(false);renderLocateBtn();syncTools();renderTrk();
</script>
